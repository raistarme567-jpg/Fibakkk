services:
  - type: web
    name: project-fiba-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: ADMIN_MASTER_PASSWORD
        value: Admin@Flame2025
      - key: CORS_ORIGIN
        value: "*"
